name: Import MonoKernel pages
on:
  push:
    paths: ['.github/workflows/import-monokernel.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download staged files
        run: |
          set -e
          mkdir -p monokernel
          curl -fsSL -o monokernel/index.html       https://litter.catbox.moe/go86ww.html
          curl -fsSL -o monokernel/intro.html       https://litter.catbox.moe/c1eu85.html
          curl -fsSL -o monokernel/kernel-chain.gif https://litter.catbox.moe/q18ecj.gif
          curl -fsSL -o monokernel/monokernel.gif   https://litter.catbox.moe/v4obel.gif
          curl -fsSL -o index.html                   https://litter.catbox.moe/oefzlo.html
          curl -fsSL -o optimization/index.html      https://litter.catbox.moe/v875ga.html
          curl -fsSL -o pure-optimization/index.html https://litter.catbox.moe/sybrat.html
          curl -fsSL -o pr-review/index.html         https://litter.catbox.moe/psyh7e.html
          grep -q "MonoKernel" index.html && grep -q "intro.html" monokernel/index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add MonoKernel explainer and intro pages; link them from the site menu"
          git push
      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" || true
